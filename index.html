<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことばのQR玉手箱</title><style>
:root{font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;color:#254d45;background:#fffaf0}*{box-sizing:border-box}body{margin:0}main{max-width:520px;min-height:100dvh;margin:auto;text-align:center;padding:22px 16px 38px;background:linear-gradient(#fffef8,#fff3d7)}h1{font-size:clamp(25px,7vw,37px);margin:8px 0;color:#176354}h2{font-size:clamp(23px,6vw,30px);color:#db6609;margin:10px 0 22px}.chest{font-size:135px;line-height:1.5;filter:drop-shadow(0 6px 10px #b88d52);animation:float 3s ease-in-out infinite}.stars{font-size:29px;color:#e4a51e;letter-spacing:12px}.gold-note{background:#fff7dd;border:2px solid #e8b853;border-radius:16px;padding:12px;margin:20px auto;max-width:390px;font-weight:bold;font-size:17px}.gold-note strong{color:#d55008}button{font:inherit;font-weight:bold;font-size:clamp(18px,5vw,23px);background:linear-gradient(#ff6860,#d90f2a);border:4px solid #f4bd3e;border-radius:40px;color:white;padding:17px 12px;width:100%;max-width:420px;box-shadow:0 5px 0 #a66a22;cursor:pointer}button:disabled{opacity:.65;cursor:default}.small{font-size:13px;color:#67766b}.result img{display:block;width:100%;height:auto;border-radius:12px;background:white}.result{background:white;padding:12px;border-radius:18px;border:3px solid #ebd5a4;margin-top:15px}.result.gold{border:5px solid #e6ad19;box-shadow:0 0 20px #ffda66}.result h2{margin:6px 0 12px}.hidden{display:none}.back{color:#7a6551;font-size:13px;margin-top:20px}@keyframes float{50%{transform:translateY(-8px)}}
.cover{position:relative;width:100%;margin:0 auto}.cover-image{display:block;width:100%;height:auto}.image-button{position:absolute;left:7%;top:63.3%;width:88%;height:12.3%;max-width:none;margin:0;padding:0;background:transparent;border:0;border-radius:60px;box-shadow:none;cursor:pointer;touch-action:manipulation}.image-button:focus-visible{outline:4px solid #1462c2;outline-offset:2px}.image-button:disabled{opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}main:has(.cover){padding:0 0 32px;background:#fff}.cover+.hidden{display:none}#result{padding:18px 14px} </style></head><body><main>
<section id="start" class="cover"><img class="cover-image" src="玉手箱.png" alt="ことばのQR玉手箱。豪華な玉手箱とラッキーワードガチャの案内"><button id="draw" class="image-button" aria-label="ラッキーワードガチャを回そう！"><span class="sr-only">ラッキーワードガチャを回そう！</span></button></section>
<section id="result" class="hidden" aria-live="polite"><h1>ことばのQR玉手箱</h1><p class="stars">✦ ✧ ✦</p><div id="card" class="result"><img id="fortune" alt="今日のラッキーワードのカード"></div><p>📸 気に入った言葉は、スクリーンショットで保存してね！</p><p class="back">もう一度遊ぶときは、QRコードを読み直してね。</p></section>
</main><script>
// 01.gif 〜 25.gif を images フォルダーに置いてください。
// ゴールドカードは25番として設定。変更する場合は下の 25 を変更してください。
const GOLD_CARD=25;
const start=document.getElementById('start'), result=document.getElementById('result');
const button=document.getElementById('draw');let drawn=false;
button.addEventListener('click',()=>{if(drawn)return;drawn=true;button.disabled=true;const n=Math.floor(Math.random()*25)+1;const file=String(n).padStart(2,'0');const img=document.getElementById('fortune');img.src='images/'+file+'.gif';img.alt='ラッキーワードカード '+file;document.getElementById('card').classList.toggle('gold',n===GOLD_CARD);img.onerror=()=>{img.alt='画像が見つかりません：images/'+file+'.gif';};start.classList.add('hidden');result.classList.remove('hidden');window.scrollTo(0,0);});
</script></body></html>
